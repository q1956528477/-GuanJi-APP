<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="coinBg3">
      <stop offset="0%" stop-color="#d69a52"/>
      <stop offset="40%" stop-color="#b87a3c"/>
      <stop offset="70%" stop-color="#8d5524"/>
      <stop offset="100%" stop-color="#6d3e18"/>
    </radialGradient>
    <radialGradient id="holeGrad3">
      <stop offset="0%" stop-color="#3d2b0f"/>
      <stop offset="100%" stop-color="#1a1408"/>
    </radialGradient>
    <filter id="rust3">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0.12" result="desaturatedNoise"/>
      <feComponentTransfer in="desaturatedNoise" result="theNoise">
        <feFuncA type="table" tableValues="0 0 0.06 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="theNoise" mode="multiply"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#coinBg3)" stroke="#4d3215" stroke-width="2"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#d89a50" stroke-width="0.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="95" fill="url(#coinBg3)" filter="url(#rust3)" opacity="0.35"/>
  
  <circle cx="100" cy="100" r="75" fill="none" stroke="#8d5524" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#c88740" stroke-width="0.8" opacity="0.5"/>
  
  <rect x="85" y="85" width="30" height="30" fill="url(#holeGrad3)" stroke="#2d1f0a" stroke-width="1.5"/>
  <rect x="85.5" y="85.5" width="29" height="29" fill="none" stroke="#1a1408" stroke-width="0.5"/>
  
  <text x="100" y="60" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#2d1f0a" text-anchor="middle">永</text>
  <text x="100" y="150" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#2d1f0a" text-anchor="middle">樂</text>
  <text x="130" y="105" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#2d1f0a" text-anchor="middle">通</text>
  <text x="70" y="105" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#2d1f0a" text-anchor="middle">寶</text>
  
  <text x="100.5" y="60.5" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#c88740" text-anchor="middle" opacity="0.3">永</text>
  <text x="100.5" y="150.5" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#c88740" text-anchor="middle" opacity="0.3">樂</text>
  <text x="130.5" y="105.5" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#c88740" text-anchor="middle" opacity="0.3">通</text>
  <text x="70.5" y="105.5" font-family="'STKaiti', 'KaiTi', 'SimKai', serif" font-size="22" font-weight="bold" fill="#c88740" text-anchor="middle" opacity="0.3">寶</text>
</svg>
